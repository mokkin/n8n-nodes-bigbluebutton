name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build and tests
        # Live tests against a real server run only if BBB_URL / BBB_SECRET secrets are configured
        run: npm test
        env:
          BBB_URL: ${{ secrets.BBB_URL }}
          BBB_SECRET: ${{ secrets.BBB_SECRET }}
